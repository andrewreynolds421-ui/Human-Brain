<!--
  Neural Core panel — drop-in for the Warmind dashboard.

  Paste the three blocks (style, markup, script) into the dashboard, or load
  this file in an <iframe>. Then call once:

      NeuralPanel.init({ api: API_BASE, accessCode: ACCESS_CODE, mount: '#neural-core' });

  The panel polls GET /api/neural/state once a second and:
    * draws a raster of the last 300 ms of spikes (rows = layers, blue = excitatory, ember = inhibitory)
    * shows per-layer firing rates, the regime, simulation time and speed
    * exposes buttons: PING (stimulate L4), + / − (reward ±1), RESET
    * publishes state for the rest of the dashboard:
          window.NeuralCore.activity   0..1, normalised mean firing rate
          window.NeuralCore.burst      true while a population burst is happening
          window.NeuralCore.state      the last full state object
      and fires  window.dispatchEvent(new CustomEvent('neural:state', {detail: state}))

  Hooking the particle sphere (example — adapt to the sphere's own variables):

      window.addEventListener('neural:state', e => {
        const a = window.NeuralCore.activity;          // idle glow follows the rate
        sphereGlow = 0.35 + 0.65 * a;
        if (window.NeuralCore.burst) sphereFlare = 1.0;  // a burst = a flare
      });
-->

<style>
  .nc-panel{font-family:inherit;color:var(--text,#e8dcc8);background:var(--panel,#0e0f12);border:1px solid var(--line,#2a2520);border-radius:10px;padding:12px 14px;min-width:300px}
  .nc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .nc-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  .nc-badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line,#2a2520);text-transform:uppercase;letter-spacing:.08em}
  .nc-badge.asynchronous{color:#9fd3a3;border-color:#2f6b3a}
  .nc-badge.synchronous{color:#f0c060;border-color:#7a5a1a}
  .nc-badge.bursting{color:#ff6a2b;border-color:#8a3a14;animation:nc-blink 1s infinite}
  .nc-badge.silent,.nc-badge.warming,.nc-badge.paused,.nc-badge.error,.nc-badge.offline{color:#8a8a8a}
  @keyframes nc-blink{50%{opacity:.4}}
  .nc-raster{width:100%;height:120px;display:block;background:#07080a;border:1px solid var(--line,#2a2520);border-radius:6px}
  .nc-rates{display:grid;grid-template-columns:40px 1fr 44px;gap:4px 8px;align-items:center;margin-top:8px;font-size:11px}
  .nc-bar{height:7px;background:#17191d;border-radius:4px;overflow:hidden}
  .nc-bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff6a2b,#f0c060);width:0;transition:width .4s}
  .nc-bar.e>i{background:linear-gradient(90deg,#3d6fa8,#8fc1ff)}
  .nc-meta{display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-top:8px}
  .nc-actions{display:flex;gap:6px;margin-top:10px}
  .nc-actions button{flex:1;background:#15161a;color:inherit;border:1px solid var(--line,#2a2520);border-radius:6px;padding:6px 0;font-size:11px;letter-spacing:.08em;cursor:pointer}
  .nc-actions button:hover{border-color:#ff6a2b}
  .nc-events{margin-top:8px;font-size:10.5px;opacity:.65;max-height:54px;overflow:auto;line-height:1.5}
</style>

<div id="neural-core" class="nc-panel">
  <div class="nc-head">
    <span class="nc-title">Neural core · human cortical column</span>
    <span class="nc-badge offline" id="nc-regime">offline</span>
  </div>
  <canvas class="nc-raster" id="nc-raster" width="600" height="120"></canvas>
  <div class="nc-rates" id="nc-rates"></div>
  <div class="nc-meta"><span id="nc-time">t = 0.0 s</span><span id="nc-speed"></span><span id="nc-size"></span></div>
  <div class="nc-actions">
    <button id="nc-ping" title="Stimulate layer 4 (sensory input)">PING</button>
    <button id="nc-plus" title="Reward +1: strengthen what the core just did">＋ REWARD</button>
    <button id="nc-minus" title="Reward −1: weaken what the core just did">− PUNISH</button>
    <button id="nc-reset" title="Restore the initial state">RESET</button>
  </div>
  <div class="nc-events" id="nc-events"></div>
</div>

<script>
(function () {
  const POPS = ['L23E','L23I','L4E','L4I','L5E','L5I','L6E','L6I'];
  const LAYER_OF = [0,0,1,1,2,2,3,3];
  const cfg = { api: '', accessCode: '', mount: '#neural-core', intervalMs: 1000, rateScale: 25 };
  const NC = window.NeuralCore = { activity: 0, burst: false, state: null, online: false };
  let timer = null, root = null;

  function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (cfg.accessCode) h['X-Access-Code'] = cfg.accessCode;
    return h;
  }
  async function call(path, body) {
    const r = await fetch(cfg.api + path, body ? { method: 'POST', headers: headers(), body: JSON.stringify(body) }
                                               : { headers: headers() });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    return r.json();
  }

  function drawRaster(st) {
    const c = root.querySelector('#nc-raster'), ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    ctx.fillStyle = '#07080a'; ctx.fillRect(0, 0, W, H);
    const rows = 4, rowH = H / rows;
    ctx.strokeStyle = '#1b1d22'; ctx.lineWidth = 1;
    for (let k = 1; k < rows; k++) { ctx.beginPath(); ctx.moveTo(0, k * rowH); ctx.lineTo(W, k * rowH); ctx.stroke(); }
    ctx.fillStyle = '#4a4740'; ctx.font = '10px monospace';
    ['L2/3','L4','L5','L6'].forEach((l, k) => ctx.fillText(l, 4, k * rowH + 11));
    const r = st.raster; if (!r || !r.i.length) return;
    const n = st.neurons || 1, win = r.window_ms || 300;
    for (let k = 0; k < r.i.length; k++) {
      const pop = r.pop[k], layer = LAYER_OF[pop], exc = pop % 2 === 0;
      const x = (r.t_ms[k] / win) * W;
      // spread neurons of a layer vertically by id within the row
      const y = layer * rowH + 3 + ((r.i[k] * 7919) % 1000) / 1000 * (rowH - 6);
      ctx.fillStyle = exc ? 'rgba(143,193,255,0.85)' : 'rgba(255,106,43,0.85)';
      ctx.fillRect(x, y, 1.6, 1.6);
    }
  }

  function drawRates(st) {
    const box = root.querySelector('#nc-rates');
    if (!box.children.length) {
      box.innerHTML = POPS.map(p => `<span>${p}</span><div class="nc-bar ${p.endsWith('E') ? 'e' : 'i'}"><i></i></div><span data-v="${p}">–</span>`).join('');
    }
    POPS.forEach((p, k) => {
      const v = st.rates ? st.rates[p] : 0;
      box.querySelectorAll('.nc-bar')[k].firstChild.style.width = Math.min(100, 100 * v / cfg.rateScale) + '%';
      box.querySelector(`[data-v="${p}"]`).textContent = v.toFixed(1) + ' Hz';
    });
  }

  function render(st) {
    const badge = root.querySelector('#nc-regime');
    const regime = st.status === 'running' ? (st.regime || 'silent') : (st.status || 'offline');
    badge.textContent = regime; badge.className = 'nc-badge ' + regime;
    root.querySelector('#nc-time').textContent = 't = ' + ((st.t_ms || 0) / 1000).toFixed(1) + ' s';
    root.querySelector('#nc-speed').textContent = st.realtime_factor ? ('×' + st.realtime_factor + ' real time') : '';
    root.querySelector('#nc-size').textContent = st.neurons ? (st.neurons.toLocaleString() + ' neurons') : '';
    root.querySelector('#nc-events').innerHTML = (st.events || []).slice(-5).reverse()
      .map(e => `<div>${(e.t_ms / 1000).toFixed(1)}s · ${e.kind} ${e.detail}</div>`).join('');
    drawRaster(st); drawRates(st);
    NC.state = st; NC.online = st.status === 'running';
    NC.activity = Math.max(0, Math.min(1, (st.mean_rate || 0) / cfg.rateScale));
    NC.burst = !!st.bursting;
    window.dispatchEvent(new CustomEvent('neural:state', { detail: st }));
  }

  async function poll() {
    try { render(await call('/api/neural/state')); }
    catch (e) { render({ status: 'offline', events: [{ t_ms: 0, kind: 'offline', detail: String(e.message || e) }] }); }
  }

  NC.stimulate = (layer = 'L4', strength = 1.0, duration_ms = 100, label = '') =>
    call('/api/neural/stimulate', { layer, strength, duration_ms, label }).then(poll);
  NC.reward = (value, note = '') => call('/api/neural/reward', { value, note }).then(poll);
  NC.reset = () => call('/api/neural/control', { action: 'reset' }).then(poll);

  window.NeuralPanel = {
    init(options) {
      Object.assign(cfg, options || {});
      root = document.querySelector(cfg.mount) || document.getElementById('neural-core');
      root.querySelector('#nc-ping').onclick = () => NC.stimulate('L4', 1.5, 100, 'manual ping');
      root.querySelector('#nc-plus').onclick = () => NC.reward(1, 'operator');
      root.querySelector('#nc-minus').onclick = () => NC.reward(-1, 'operator');
      root.querySelector('#nc-reset').onclick = () => NC.reset();
      clearInterval(timer); timer = setInterval(poll, cfg.intervalMs); poll();
    },
    stop() { clearInterval(timer); }
  };
})();
</script>
